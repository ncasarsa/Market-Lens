[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "marketlens"
version = "0.1.0"
description = "Explainable neural trading signal platform: TFT + LSTM regime detection + DeepSHAP"
authors = [
    { name = "Nathan Casarsa", email = "njc013@bucknell.edu" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "pytorch-forecasting>=1.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "ta>=0.11.0",
    "transformers>=4.38.0",
    "feedparser>=6.0.10",
    "shap>=0.44.0",
    "scikit-learn>=1.4.0",
    "wandb>=0.17.0",
    "streamlit>=1.33.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "pyngrok>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[project.urls]
Repository = "https://github.com/ncasarsa/Market-Lens"
